<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avantis Safety Center</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #16445a; background: #eaf4f7; }
    * { box-sizing: border-box; }
    body { width: 390px; margin: 0; background: #eaf4f7; }
    header { padding: 16px 18px; color: #fff; background: #0b6478; }
    h1 { margin: 0; font-size: 18px; }
    p { margin: 5px 0 0; color: #dff7f8; font-size: 12px; }
    main { padding: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 12px; }
    select, button { width: 100%; padding: 8px; border: 1px solid #bfd5db; border-radius: 5px; background: #fff; color: #16445a; }
    button { margin-top: 10px; border: 0; color: #fff; background: #087f92; cursor: pointer; }
    button:hover { background: #075d70; }
    #summary { margin: 12px 0 7px; color: #527184; font-size: 12px; }
    ul { max-height: 260px; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
    li { padding: 9px 0; border-bottom: 1px solid #d9e8eb; font-size: 12px; line-height: 1.35; }
    li strong { display: block; color: #075d70; }
    .empty { color: #527184; }
  </style>
</head>
<body>
  <header><h1>Avantis Safety Center</h1><p>Only blocked visits are stored locally.</p></header>
  <main>
    <label for="retention">Keep blocked records for</label>
    <select id="retention">
      <option value="1">1 hour</option>
      <option value="24" selected>24 hours</option>
      <option value="168">7 days</option>
    </select>
    <div id="summary"></div>
    <ul id="events"></ul>
    <button id="clear">Clear activity</button>
  </main>
  <script src="safety.js"></script>
</body>
</html>
